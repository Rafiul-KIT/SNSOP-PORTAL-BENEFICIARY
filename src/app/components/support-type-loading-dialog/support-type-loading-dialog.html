<p-dialog [visible]="visible" [modal]="true" [closable]="false" [closeOnEscape]="false" [draggable]="false"
  [resizable]="false" [showHeader]="false" [style]="{ width: '360px' }">
  <div class="model-loading">
    <p-progress-spinner strokeWidth="4" [style]="{ width: '56px', height: '56px' }" />
    <div class="model-loading-title">Running Support Type Recommendation</div>
    <div class="model-loading-subtitle">Please wait...</div>
  </div>
</p-dialog>
