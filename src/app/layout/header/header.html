<div class="header">
  <!-- Portal selector (left) -->
  <div class="portals" (click)="showPortalOptions = !showPortalOptions">
    <i class="fas fa-braille hand"></i>
    <div>
      <small>Portal</small>
      <span class="name">Beneficiary</span>
    </div>
    <i class="fas fa-angle-{{ showPortalOptions ? 'down' : 'right' }} hand"></i>
    <span class="vertical-line"></span>
  </div>
  <div class="menues">
    <p-menubar [model]="menuList"></p-menubar>
  </div>

  <div
    class="portals-option-wrapper {{ showPortalOptions ? 'show' : '' }}"
    (mouseleave)="showPortalOptions = false"
  >
    <div class="portal-items">
      @for (portal of portalList; track portal) {
        <a class="item" [href]="portal.link">
          <i class="{{ portal.icon }} w-50"></i>
          <span>{{ portal.label }}</span>
        </a>
      }
    </div>
  </div>

  <p-button
    [text]="true"
    icon="fas fa-user-circle fa-lg"
    severity="info"
    (onClick)="showUsermenu = !showUsermenu"
  ></p-button>

  <div
    class="user-menu {{ showUsermenu ? 'show' : '' }}"
    (mouseleave)="showUsermenu = false"
  >
    <div class="item" (click)="goToProfile()">
      <i class="fas fa-user me-2"></i>
      Profile
    </div>
    <div class="item" (click)="logout()">
      <i class="fas fa-sign-out-alt me-2"></i>
      Logout
    </div>
  </div>
</div>
