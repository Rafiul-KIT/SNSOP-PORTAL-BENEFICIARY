@if(isLoading){
<app-loader />
}@else{
<div class="breadcrumb-wrapper">
  <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome" class="w-100" />
</div>

<div class="card p-3 mb-2">
  <form [formGroup]="searchForm" class="row g-3">
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select formControlName="approvalStatus" [options]="[
        { label: 'Pending', value: 'PENDING' },
        { label: 'Approved', value: 'APPROVED' },
        { label: 'Rejected', value: 'REJECTED' }
      ]" optionLabel="label" optionValue="value" class="w-100">
        </p-select>
        <label>Approval Status</label>
      </p-floatlabel>
    </div>

    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select formControlName="taskType" [options]="[
        { label: 'Edit', value: 'BENEFICIARY_EDIT' },
        { label: 'Delete', value: 'BENEFICIARY_DELETE' }
      ]" optionLabel="label" optionValue="value" class="w-100">
        </p-select>
        <label>Task Type</label>
      </p-floatlabel>
    </div>

    <!-- @if(advanceSearchPanelVisible){
    <div class="col-md-3">
      <p-floatlabel variant="on">
        <input pInputText class="form-control" formControlName="middleName" />
        <label>Middle Name</label>
      </p-floatlabel>
    </div>
    }
    <div class="col-md-3">
      <p-floatlabel variant="on">
        <input pInputText class="form-control" formControlName="lastName" />
        <label>Last Name</label>
      </p-floatlabel>
    </div>
    <div class="col-md-3">
      <p-floatlabel variant="on">
        <label>Phone Number</label>
        <input pInputText class="form-control" formControlName="phoneNumber" />
      </p-floatlabel>
    </div>
    @if(advanceSearchPanelVisible){
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="states" optionLabel="name" formControlName="state" />
        <label>State</label>
      </p-floatlabel>
    </div>
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="counties" optionLabel="name" formControlName="county" />
        <label>County</label>
      </p-floatlabel>
    </div>
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="payams" optionLabel="name" formControlName="payam" />
        <label>Payam</label>
      </p-floatlabel>
    </div>
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="bomas" optionLabel="name" formControlName="boma" />
        <label>Boma</label>
      </p-floatlabel>
    </div>
    } -->
    <div class="col-12 text-end">
      <p-button label="Reset" icon="fas fa-refresh" severity="danger" class="me-2" size="small" (onClick)="resetForm()"
        outlined="true">
      </p-button>

      <p-button label="Search" icon="fas fa-search" severity="primary" size="small" (onClick)="searchBeneficiaries()">
      </p-button>
    </div>

  </form>
</div>
<p-table [value]="paginatedBeneficiaries" [scrollable]="true"
  [scrollHeight]="advanceSearchPanelVisible ? '52vh' : '64vh'"
  [tableStyle]="{ 'min-width': '100%', 'margin-bottom': '5px' }">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Status</th>
      <th>Approvar Role</th>
      <th>Task Type</th>
      <th class="text-center" [style]="{ width: '185px' }">Action</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-b>
    <tr>
      <td>{{ b.id }}</td>
      <td>{{ b.approvalStatus }}</td>
      <td>{{ b.approverRole }}</td>
      <td>{{ b.taskType }}</td>
      <td class="text-center">
        <p-button type="button" icon="fas fa-eye" pTooltip="View" tooltipPosition="top" appendTo="body" size="small"
          outlined="true" severity="info" (onClick)="viewTask(b)" class="me-2" />
        <!-- <p-button
          type="button"
          icon="fas fa-check"
          pTooltip="Approve"
          tooltipPosition="top"
          appendTo="body"
          size="small"
          outlined="true"
          severity="primary"
          (onClick)="approveTask(b)"
          class="me-2"
        />
        <p-button
          type="button"
          icon="fas fa-ban"
          pTooltip="Reject"
          tooltipPosition="top"
          appendTo="body"
          size="small"
          outlined="true"
          severity="danger"
          (onClick)="rejectTask(b)"
        /> -->
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5" class="text-center text-danger">
        <b>No beneficiaries found!</b>
      </td>
    </tr>
  </ng-template>
</p-table>

<p-paginator class="paginator-sticky" [rows]="pageSize" [totalRecords]="beneficiaries.length"
  [rowsPerPageOptions]="[10, 25, 50]" (onPageChange)="onPageChange($event)" [appendTo]="'body'"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"></p-paginator>
}
<p-toast position="bottom-right" />
<p-confirmDialog [style]="{ width: '450px' }" />
